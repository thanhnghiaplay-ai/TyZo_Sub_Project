# Đóng gói tệp cài Android. Chỉ chạy khi thư mục android/ đổi, không đụng tới web (Vercel) hay cầu nối.
#
# Bí mật (Settings → Secrets and variables → Actions → Secrets), tạo bằng «tyzo» → mục 15 trên VPS:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Biến (tab Variables, tùy chọn): TYZO_WEB_URL — địa chỉ web điền sẵn trong ứng dụng.
#
# Có khóa ký và chạy trên nhánh main: đăng bản phát hành «android-v<versionName>» (tyzo-sub.apk + tyzo-sub.json).
# Web đọc bản phát hành mới nhất để hiện nút tải và báo ứng dụng cũ tự cập nhật.
# Chưa có khóa ký: chỉ đóng gói bản thử (khóa thử), không đăng phát hành.
name: Android thử

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-thu.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      TYZO_WEB_URL: ${{ vars.TYZO_WEB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Lấy khóa ký (nếu có)
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tyzo.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/tyzo.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Ký bằng khóa cố định."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Chưa có khóa ký: dùng khóa thử, không đăng phát hành."
          fi
      - name: Đóng gói tệp cài
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Đổi tên tệp cài và ghi số bản
        id: ver
        run: |
          cp app/build/outputs/apk/release/app-release.apk tyzo-sub.apk
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          printf '{"code": %s, "name": "%s"}\n' "$code" "$name" > tyzo-sub.json
          cat tyzo-sub.json
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: tyzo-sub-apk
          path: |
            android/tyzo-sub.apk
            android/tyzo-sub.json
          retention-days: 30
      - name: Đăng bản phát hành (chỉ nhánh main, đã có khóa ký)
        if: github.ref == 'refs/heads/main' && steps.key.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.ver.outputs.name }}
          name: TyZo Sub Android ${{ steps.ver.outputs.name }}
          body: Tệp cài ứng dụng Android TyZo Sub. Tải tyzo-sub.apk rồi mở để cài (cần Android 10 trở lên).
          make_latest: "true"
          overwrite_files: true
          files: |
            android/tyzo-sub.apk
            android/tyzo-sub.json
