# Đóng gói tệp cài Android. Chỉ chạy khi thư mục android/ đổi, không đụng tới web (Vercel) hay cầu nối (Fly.io).
#
# Tùy chọn (Settings → Secrets and variables → Actions):
#   biến   TYZO_WEB_URL                 địa chỉ web điền sẵn trong ứng dụng, ví dụ https://tyzo.vn
#   bí mật ANDROID_KEYSTORE_BASE64      tệp khóa ký (.jks) mã hóa base64
#   bí mật ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Có khóa ký thì mọi bản cùng một chữ ký, khách cài bản mới đè bản cũ. Không có thì ký khóa thử, mỗi lần một khóa.
name: Android thử

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-thu.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      TYZO_WEB_URL: ${{ vars.TYZO_WEB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Lấy khóa ký (nếu có)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tyzo.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/tyzo.jks" >> "$GITHUB_ENV"
            echo "Ký bằng khóa cố định."
          else
            echo "Chưa có khóa ký: dùng khóa thử."
          fi
      - name: Đóng gói tệp cài
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Đổi tên tệp cài
        run: cp app/build/outputs/apk/release/app-release.apk tyzo-sub.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tyzo-sub-apk
          path: android/tyzo-sub.apk
          retention-days: 30
