# Đóng gói tệp cài Android. Chỉ chạy khi thư mục android/ đổi, không đụng tới web (Vercel) hay cầu nối.
#
# Bí mật (Settings → Secrets and variables → Actions → Secrets), tạo bằng «tyzo» → mục 15 trên VPS:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Biến (tab Variables, tùy chọn): TYZO_WEB_URL — địa chỉ web điền sẵn trong ứng dụng.
#
# Có khóa ký và chạy trên nhánh main: đăng bản phát hành «android-v<versionName>» (tyzo-sub.apk + tyzo-sub.json).
# Web đọc bản phát hành mới nhất để hiện nút tải và báo ứng dụng cũ tự cập nhật.
# Chưa có khóa ký: chỉ đóng gói bản thử (khóa thử), không đăng phát hành.
name: Android thử

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-thu.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.key.outputs.signed }}
      version: ${{ steps.ver.outputs.name }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      TYZO_WEB_URL: ${{ vars.TYZO_WEB_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: "8.14.3"
      - name: Kiểm tra cách ly tài khoản và đồng bộ phiên (JVM)
        run: bash tools/check-session-ci.sh
      - name: Lấy khóa ký (nếu có)
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tyzo.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/tyzo.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Ký bằng khóa cố định."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Chưa có khóa ký: dùng khóa thử, không đăng phát hành."
          fi
      - name: Đóng gói tệp cài
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Đổi tên tệp cài và ghi số bản
        id: ver
        run: |
          cp app/build/outputs/apk/release/app-release.apk tyzo-sub.apk
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          printf '{"code": %s, "name": "%s"}\n' "$code" "$name" > tyzo-sub.json
          cat tyzo-sub.json
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tyzo-sub-apk
          path: |
            android/tyzo-sub.apk
            android/tyzo-sub.json
          retention-days: 30

  release:
    needs: apk
    if: github.ref == 'refs/heads/main' && needs.apk.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tyzo-sub-apk
          path: release
      - name: Đăng bản phát hành (chỉ nhánh main, đã có khóa ký)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: android-v${{ needs.apk.outputs.version }}
          name: TyZo Sub Android ${{ needs.apk.outputs.version }}
          body: Tệp cài ứng dụng Android TyZo Sub. Tải tyzo-sub.apk rồi mở để cài (cần Android 10 trở lên).
          make_latest: "true"
          overwrite_files: true
          files: |
            release/tyzo-sub.apk
            release/tyzo-sub.json
