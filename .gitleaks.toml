# gitleaks cho TyZo: dùng luật mặc định, chỉ bỏ các chỗ ĐÃ KIỂM là không phải bí mật (26/11/2026).
[extend]
useDefault = true

[[allowlists]]
description = "Bộ nhớ đệm graphify (chuỗi băm của tệp) và bản dựng Vercel (thư viện edge-tts, mã công khai)"
paths = ['''graphify-out/cache/''', '''^\.vercel/''']

[[allowlists]]
# Kiểm toán NEW-004: chỉ bỏ ĐÚNG chuỗi giả này, ĐÚNG trong tệp test này (trước đây bỏ mọi dòng `const secret = "` ở mọi tệp).
description = "Chuỗi giả trong test cầu nối Dịch trực tiếp"
condition = "AND"
paths = ['''^src/lib/live/live-wire\.test\.ts$''']
regexTarget = "line"
regexes = ['''const secret = "bi-mat-thu-nghiem-24-ky-tu-xx";''']
