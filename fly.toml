# fly.toml app configuration file generated for tyzo-sub-project on 2026-11-14T20:53:34Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'tyzo-sub-project'
primary_region = 'sin'

[build]
[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
