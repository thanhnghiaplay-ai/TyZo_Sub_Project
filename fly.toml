# Cầu nối Dịch trực tiếp. Đặt bí mật bằng `fly secrets set` hoặc ô Environment variables, không ghi vào file này.
# Cần: LIVE_BRIDGE_SECRET, DATABASE_URL (và ALIBABA_WORKSPACE_ID nếu không nhập ở Admin).
app = "tyzo-live-bridge"
primary_region = "sin"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
